:root{--bg:#0F0E12;--fg:#fff;--mid:#BFB8B5;--low:#625B58}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:'Deck Sans',Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
.m{font-family:'Deck Mono','Courier New',monospace;font-weight:400;text-transform:uppercase}
.bg{position:absolute;inset:-2%;background-size:cover;background-position:center;will-change:transform,opacity}
.veil{position:absolute;inset:0;background:rgba(0,0,0,.2);pointer-events:none}
.logo{position:relative;display:block}
.logo img{display:block;width:100%;height:100%}
.logo .fb{display:none;font-family:'Deck Sans',sans-serif;font-weight:400;line-height:1;letter-spacing:-.04em}
.logo.nologo img{display:none}.logo.nologo .fb{display:block}
.bg .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

html,body{background:#fff}
#stage{background:#fff;color:#0F0E12}
.dark img{filter:brightness(0) saturate(100%) opacity(.94)}
.dark .fb{color:#0F0E12}
.nav{position:absolute;left:96px;right:96px;top:24px;height:32px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;z-index:5}
.nav .logo{width:86.497px;height:32px}
.nav .logo .fb{font-size:34px}
.nav .pg{justify-self:center;font-size:14px;color:rgba(15,14,18,.5)}
.nav .lab{justify-self:end;font-size:24px}

/* ---------- colonne gauche ---------- */
.col{position:absolute;left:96px;top:120px;width:826px;z-index:4}
.tagline{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.06em;height:8px}
.tagline i{display:block;width:8px;height:8px;background:#0F0E12}
h1{margin:12px 0 0;font-family:'Deck Mono',monospace;font-weight:400;font-size:48px;line-height:normal;text-transform:uppercase}
.mk{display:block;overflow:hidden}.rv{display:block}
.lead{margin:32px 0 0;width:463px;font-weight:400;font-size:24px;line-height:normal}
.list{margin-top:56px}
.item{position:relative;padding-bottom:42px;cursor:pointer;opacity:.32;transition:opacity .45s ease}
.item.on{opacity:1}
.item .hd{display:flex;align-items:center;gap:12px;height:24px}
.item .nm{font-size:24px}
.item .rl{margin-left:auto;font-size:14px;letter-spacing:.04em;color:rgba(15,14,18,.55)}
.item .nb{width:40px;text-align:right;font-size:14px;color:rgba(15,14,18,.55)}
.item .ds{height:0;overflow:hidden}
.item .ds p{margin:0;padding-top:12px;font-weight:300;font-size:18px;line-height:normal;text-transform:uppercase;max-width:760px}
.item .bar{position:absolute;left:0;right:0;bottom:20px;height:1px;background:rgba(15,14,18,.12);opacity:0}
.item .bar b{position:absolute;left:0;top:0;bottom:0;width:100%;background:#0F0E12;transform-origin:left center;transform:scaleX(0)}
.item.on .bar{opacity:1}

/* ---------- icône modulaire 3x3 ---------- */
.ico{position:relative;flex:none}
.ico span{position:absolute;background:#0F0E12}

/* ---------- visuel : rendus T1 détourés ---------- */
.vis{position:absolute;left:970px;top:120px;width:854px;height:854px}
.vis .grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(15,14,18,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(15,14,18,.05) 1px,transparent 1px);
  background-size:42.7px 42.7px;-webkit-mask-image:radial-gradient(ellipse 58% 58% at 40% 55%,#000 20%,transparent 76%);mask-image:radial-gradient(ellipse 58% 58% at 40% 55%,#000 20%,transparent 76%)}
.vis .big{position:absolute;left:40px;top:40px;z-index:4}
#img{position:absolute;left:950px;top:150px;width:760px;height:760px;z-index:2;transform-origin:50% 56%}
#img .fr{position:absolute;inset:0;width:100%;height:100%;opacity:0;will-change:opacity,transform}
#img .fr img{display:block;width:100%;height:100%;filter:url(#key)}
/* reflet qui balaie l'image, limité aux couches (masque = alpha du rendu) */
/* reflet : en mode overlay, invisible sur le blanc, il n'éclaire que les couches */
#img .sweep{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:overlay;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%);background-size:300% 100%;background-position:120% 0}
/* ombre douce au sol */
#img .shadow{position:absolute;left:14%;right:14%;bottom:4%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(15,14,18,.12),transparent);filter:blur(6px)}
#ld{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:3}
#ld polyline{fill:none;stroke:rgba(15,14,18,.2);stroke-width:1}
#ld polyline.on{stroke:#0F0E12}
#ld circle{fill:rgba(15,14,18,.35)}
#ld circle.on{fill:#0F0E12}
#labs{position:absolute;inset:0;pointer-events:none;z-index:4}
.lab3{position:absolute;left:1676px;transform:translateY(-50%);font-size:13px;letter-spacing:.05em;color:rgba(15,14,18,.32);white-space:nowrap;pointer-events:auto;cursor:pointer;transition:color .3s}
.lab3.on{color:#0F0E12}
</style>

const A=p=>(window.__ASSET?window.__ASSET(p):p);
window.Deck={
  fit(stage){const f=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);gsap.set(stage,{xPercent:-50,yPercent:-50,scale:s});};addEventListener('resize',f);f();},
  /* photo : assets/photos/<nom>.jpg|.webp|.png, puis les noms suivants, sinon dégradé */
  bg(el,names,gradient){
    const list=[];names.forEach(n=>['jpg','webp','png','jpeg'].forEach(x=>list.push(A('assets/photos/'+n+'.'+x))));
    el.style.background=gradient;
    let i=0;const next=()=>{if(i>=list.length)return;const s=list[i++],im=new Image();
      im.onload=()=>{el.style.background='url("'+s+'") center/cover no-repeat';};im.onerror=next;im.src=s;};next();
  },
  /* vidéo par-dessus la photo : URL donnée, puis assets/videos/<nom>.mp4|.webm ; si rien ne charge, la photo reste */
  /* vidéos hébergées sur Cloudinary (compte de Valentin) : 1080p H.264 optimisé + première frame en image d'attente */
  CLD:'https://res.cloudinary.com/dvijxs9k0/video/upload/',
  cld(id){return {video:Deck.CLD+'c_fill,w_1920,h_1080,q_auto,vc_h264,ac_none/t1-deck/'+id+'.mp4',
                  poster:Deck.CLD+'so_0,c_fill,w_1920,h_1080,q_auto/t1-deck/'+id+'.jpg'};},
  media(el,{video,cld,name,names,gradient,start}){
    let poster=null;if(cld){const c=Deck.cld(cld);video=c.video;poster=c.poster;}
    /* image d'attente : première frame de la vidéo (transition invisible), sinon les photos */
    if(poster){el.style.background=gradient;const im=new Image();im.onload=()=>{el.style.background='url("'+poster+'") center/cover no-repeat';};im.onerror=()=>Deck.bg(el,names,gradient);im.src=poster;}
    else Deck.bg(el,names,gradient);
    el._start=start||0;
    /* copie locale d'abord (plus fluide), puis l'URL en ligne */
    const srcs=[A('assets/videos/'+name+'.mp4'),A('assets/videos/'+name+'.webm')];if(video)srcs.push(video);
    let i=0;const next=()=>{if(i>=srcs.length){el._noVideo=true;if(el._ready){const f=el._ready;el._ready=null;f();}return;}
      const v=document.createElement('video');v.className='vid';v.muted=true;v.loop=true;v.playsInline=true;v.preload='metadata';
      v.setAttribute('muted','');v.setAttribute('playsinline','');
      /* boucle sur [start, fin] : saute les premiers plans si besoin */
      if(el._start){v.loop=false;v.addEventListener('ended',()=>{v.currentTime=el._start;const p=v.play();if(p)p.catch(()=>{});});}
      v.addEventListener('loadedmetadata',()=>{if(el._start)v.currentTime=el._start;v.style.opacity=0;el.appendChild(v);el._video=v;if(el._play){const f=el._ready;el._ready=null;Deck.play(el,true,f);}},{once:true});
      v.addEventListener('error',next,{once:true});
      v.src=srcs[i++];};next();
  },
  /* lance / met en pause la vidéo d'un calque (fondu quand la première image est prête) */
  /* la photo reste visible tant que la vidéo n'est pas prête à être lue d'une traite ;
     la vidéo n'apparaît (fondu) qu'après plusieurs images réellement décodées : pas de saccade au démarrage */
  play(el,on,onReady){el._play=on;
    const done=()=>{if(onReady){const f=onReady;onReady=null;f();}};
    const v=el._video;
    if(!on){el._ready=null;if(v)v.pause();return;}
    if(!v){if(el._noVideo)done();else el._ready=done;return;}
    v.preload='auto';if(el._start&&v.currentTime<el._start)v.currentTime=el._start;
    if(v._shown){const p=v.play();if(p)p.catch(()=>{});done();return;}
    /* calque encore invisible : la vidéo s'affiche directement (le calque fera le fondu) ; sinon fondu par-dessus la photo */
    const reveal=()=>{if(!el._play||v._shown)return;v._shown=true;
      if(+gsap.getProperty(el,'opacity')<.05)gsap.set(v,{opacity:1});else gsap.to(v,{opacity:1,duration:.9,ease:'power2.inOut'});done();};
    const go=()=>{if(!el._play)return;const p=v.play();if(p)p.catch(()=>{});
      if(v.requestVideoFrameCallback){let n=0;const cb=()=>{if(++n>=8)reveal();else v.requestVideoFrameCallback(cb);};v.requestVideoFrameCallback(cb);}
      else v.addEventListener('playing',()=>setTimeout(reveal,350),{once:true});};
    if(v.readyState>=4)go();else if(!v._waiting){v._waiting=true;v.addEventListener('canplaythrough',()=>{v._waiting=false;go();},{once:true});}
  },
  /* bascule entre calques de fond : le plan affiché reste à l'écran jusqu'à ce que la vidéo du suivant tourne
     (3 s max, sinon sa photo), puis fondu direct vidéo -> vidéo ; plus de photo qui apparaît entre deux plans */
  swapper(layers,dur){let vis=-1,pend=-1,tok=0,z=1;
    return function(i){const t=++tok;
      if(pend>=0&&pend!==i&&pend!==vis)Deck.play(layers[pend],false);pend=i;
      if(i===vis){Deck.play(layers[i],true);return;}
      let done=false;const go=()=>{if(done||t!==tok)return;done=true;pend=-1;const old=vis;vis=i;
        gsap.set(layers[i],{zIndex:++z});
        gsap.fromTo(layers[i],{opacity:0},{opacity:1,duration:dur||1.1,ease:'power2.inOut',overwrite:'auto',
          onComplete:()=>{if(old>=0&&old!==vis){gsap.set(layers[old],{opacity:0});Deck.play(layers[old],false);}}});};
      Deck.play(layers[i],true,go);setTimeout(go,vis<0?1500:3000);};},
  /* image hébergée sur Cloudinary (photos T1) : copie locale assets/photos/<id>.jpg d'abord, puis le CDN, puis les photos de secours */
  CLDI:'https://res.cloudinary.com/dvijxs9k0/image/upload/',
  photo(el,{img,w,names,gradient}){el._noVideo=true;el.style.background=gradient||'#1b1a1f';
    const srcs=[A('assets/photos/'+img+'.jpg'),Deck.CLDI+'c_limit,w_'+(w||2400)+',q_auto:good,f_auto/t1-deck/'+img];let i=0;
    const next=()=>{if(i>=srcs.length){if(names)Deck.bg(el,names,gradient);return;}const s=srcs[i++],im=new Image();
      im.onload=()=>{el.style.background='url("'+s+'") center/cover no-repeat';};im.onerror=next;im.src=s;};next();},
  /* précharge la vidéo d'un calque (chapitre suivant) pour éviter les saccades au démarrage */
  warm(el){const v=el&&el._video;if(v&&v.preload!=='auto'){v.preload='auto';if(el._start&&v.currentTime<el._start)v.currentTime=el._start;}},
  logo(wrap){const img=wrap.querySelector('img');const no=()=>wrap.classList.add('nologo');
    if(img.complete&&!img.naturalWidth)no();img.addEventListener('error',no);}
};
</script>
<script>
(function(){
/* ===== Contenu (ordre du site T1) =====
   img  : rendu officiel T1 (CDN), fond taupe retiré par le filtre SVG #key ; copie locale prioritaire : assets/technology/<local>.png
   at   : point d'ancrage de la légende sur le rendu (repère 1500 x 1500)
   ico  : glyphe 3x3 — '#' plein, '.' vide, a/b/c/d = quart de cercle arrondi en haut-gauche / haut-droite / bas-droite / bas-gauche */
const CDN='https://cdn.sanity.io/images/krtz12i5/production/', Q='-1920x1920.png?w=1600&fm=webp&q=92';
const MATS=[
 {nm:'Glass',    rl:'Protective barrier', local:'01-glass',    img:'9958b29c2d2a5e265de7e56a712d335850fb0f57', at:[1323,398],  ico:['#.#','...','#.#'],
  ds:'The USA is a leading global producer of high-purity silica sand, with major deposits in Wisconsin, Illinois and Texas.'},
 {nm:'Aluminum', rl:'Framing',            local:'02-aluminum', img:'6569408b0e5a87905c673a478d8bd64332cbbdb4', at:[1316,1040], ico:['###','#.#','###'],
  ds:'A robust domestic aluminum industry, with significant capacity for recycling scrap into new frames.'},
 {nm:'Silicon',  rl:'Wafer',              local:'03-silicon',  img:'b6cd9a0d5f689a04c228310c4b35ba85b01b672d', at:[1305,655],  ico:['a#b','###','d#c'],
  ds:'Large US deposits of low-boron silica, the key raw material for ultra-pure N-type wafers.'},
 {nm:'EVA',      rl:'Sealant',            local:'04-eva',      img:'49a71a95140f8846312f74b36493bab5c0dc0f92', at:[1313,520],  ico:['###','...','###'],
  ds:'Ethylene-vinyl acetate, an oil derivative available from refineries along the Gulf Coast.'},
 {nm:'Rubber',   rl:'Weather-proofing',   local:'05-rubber',   img:'5152392a460a488b839f0aefcff94602a4e791a2', at:[1293,926],  ico:['a#b','#.#','d#c'],
  ds:'Synthetic rubber from petroleum products, while a university consortium develops a domestic natural supply.'},
 {nm:'Copper',   rl:'Stringing',          local:'06-copper',   img:'cf4311edfc3a1ea45355094dca28ee9a86622a29', at:[1249,684],  ico:['#..','###','..#'],
  ds:'Very large copper reserves in Arizona, Nevada, Minnesota and Utah connect every cell in the string.'},
 {nm:'Silver',   rl:'Contacts',           local:'07-silver',   img:'6c80eec312867c46ae1e8a919d6824fc1377f597', at:[1193,713],  ico:['#.#','#.#','#.#'],
  ds:'Around 1,100 metric tons produced in 2024, from mines in Nevada and Idaho, for the cell contacts.'}
];
const STEP=4.2, IMG_X=950, IMG_Y=150, IMG_S=760, LAB_X=1676, LAB_GAP=28;
/* ===================================== */

const stage=document.getElementById('stage');Deck.fit(stage);Deck.logo(document.getElementById('logo'));
const N=MATS.length,list=document.getElementById('list'),box=document.getElementById('img'),sweep=document.getElementById('sweep'),ld=document.getElementById('ld'),labs=document.getElementById('labs');

function loadImg(src,cors){return new Promise((res,rej)=>{const im=new Image();if(cors)im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
const frames=MATS.map(()=>{const f=document.createElement('div');f.className='fr';box.insertBefore(f,sweep);return f;});
async function loadFrame(i){const m=MATS[i];let el=null;
  try{el=await loadImg(A('assets/technology/'+m.local+'.png'),false);}
  catch(e){try{el=await loadImg(CDN+m.img+Q,false);}catch(e2){}}
  if(!el)return false;el.alt=m.nm;frames[i].appendChild(el);return true;}

/* ---- icônes modulaires ---- */
const RR={a:'borderTopLeftRadius',b:'borderTopRightRadius',c:'borderBottomRightRadius',d:'borderBottomLeftRadius'};
function cellState(ch){const s={scale:ch==='.'?0:1,borderTopLeftRadius:'0%',borderTopRightRadius:'0%',borderBottomRightRadius:'0%',borderBottomLeftRadius:'0%'};if(RR[ch])s[RR[ch]]='100%';return s;}
function makeIcon(size,gap){const el=document.createElement('div');el.className='ico';const c=(size-2*gap)/3;el.style.width=el.style.height=size+'px';
  const cells=[];for(let i=0;i<9;i++){const s=document.createElement('span');s.style.cssText='width:'+c+'px;height:'+c+'px;left:'+(i%3)*(c+gap)+'px;top:'+Math.floor(i/3)*(c+gap)+'px';el.appendChild(s);cells.push(s);}
  el._cells=cells;return el;}
function setIcon(el,g,animate){const flat=g.join('');el._cells.forEach((s,i)=>{const st=cellState(flat[i]);
  if(animate)gsap.to(s,Object.assign({duration:.55,ease:'back.out(1.6)',delay:(i%3+Math.floor(i/3))*.045,overwrite:true},st));else gsap.set(s,st);});}

/* ---- liste ---- */
let active=-1,hover=false,timer=null,prog=null,cycling=false;
function bindHover(el,i){el.addEventListener('mouseenter',()=>{hover=true;select(i);});el.addEventListener('mouseleave',()=>{hover=false;restartTimer();});}
const items=MATS.map((m,i)=>{
  const it=document.createElement('div');it.className='item';
  it.innerHTML='<div class="hd"></div><div class="ds"><p>'+m.ds+'</p></div><div class="bar"><b></b></div>';
  const hd=it.querySelector('.hd');const ic=makeIcon(14,1.5);setIcon(ic,m.ico,false);hd.appendChild(ic);
  hd.insertAdjacentHTML('beforeend','<span class="nm m">'+m.nm+'</span><span class="rl m">'+m.rl+'</span><span class="nb m">'+String(i+1).padStart(2,'0')+'</span>');
  bindHover(it,i);list.appendChild(it);return it;});

/* ---- légendes reliées aux couches ---- */
const NS='http://www.w3.org/2000/svg';
const anchors=MATS.map(m=>({x:IMG_X+m.at[0]/1500*IMG_S,y:IMG_Y+m.at[1]/1500*IMG_S}));
/* positions verticales des légendes : à la hauteur de leur couche, écartées d'au moins LAB_GAP */
const byY=anchors.map((a,i)=>i).sort((a,b)=>anchors[a].y-anchors[b].y),labY=[];
byY.forEach((i,k)=>{let y=anchors[i].y;if(k>0)y=Math.max(y,labY[byY[k-1]]+LAB_GAP);labY[i]=y;});
const leads=MATS.map((m,i)=>{const a=anchors[i],l=document.createElementNS(NS,'polyline'),c=document.createElementNS(NS,'circle');
  l.setAttribute('points',a.x+','+a.y+' '+(a.x+18)+','+a.y+' '+(LAB_X-34)+','+labY[i]+' '+(LAB_X-12)+','+labY[i]);
  c.setAttribute('cx',a.x);c.setAttribute('cy',a.y);c.setAttribute('r',2.5);ld.appendChild(l);ld.appendChild(c);gsap.set([l,c],{opacity:0});return {l,c};});
const labels=MATS.map((m,i)=>{const d=document.createElement('div');d.className='lab3 m';d.textContent=m.nm;d.style.top=labY[i]+'px';labs.appendChild(d);bindHover(d,i);gsap.set(d,{opacity:0});return d;});

/* ---- grande icône + légende ---- */
const big=makeIcon(56,5);document.getElementById('big').appendChild(big);setIcon(big,['...','...','...'],false);

function doSweep(){gsap.fromTo(sweep,{opacity:1,backgroundPosition:'120% 0'},{backgroundPosition:'-20% 0',duration:1.6,ease:'power2.inOut',overwrite:true,onComplete:()=>gsap.set(sweep,{opacity:0})});}

/* ---- sélection : fondu entre les rendus, comme sur le site T1 ---- */
function select(i){
  if(i===active||!cycling)return;const prev=active;active=i;
  items.forEach((it,j)=>{const on=j===i;it.classList.toggle('on',on);
    gsap.to(it.querySelector('.ds'),{height:on?'auto':0,duration:.6,ease:'power3.inOut',overwrite:true});
    labels[j].classList.toggle('on',on);leads[j].l.classList.toggle('on',on);leads[j].c.classList.toggle('on',on);});
  if(prev>=0)gsap.to(frames[prev],{opacity:0,duration:.8,ease:'power2.inOut',overwrite:'auto'});
  if(prev<0)gsap.set(frames[i],{opacity:1});else gsap.fromTo(frames[i],{opacity:0,scale:1.015},{opacity:1,scale:1,duration:.9,ease:'power2.out',overwrite:'auto'});
  setIcon(big,MATS[i].ico,true);
  restartTimer();
}
function restartTimer(){
  if(timer)timer.kill();if(prog)prog.kill();
  items.forEach(it=>gsap.set(it.querySelector('.bar b'),{scaleX:0}));
  if(hover||active<0)return;
  prog=gsap.to(items[active].querySelector('.bar b'),{scaleX:1,duration:STEP,ease:'none'});
  timer=gsap.delayedCall(STEP,()=>select((active+1)%N));
}

/* ---- parallax léger ---- */
const qx=gsap.quickTo(box,'x',{duration:1.4,ease:'power3.out'}),qy=gsap.quickTo(box,'y',{duration:1.4,ease:'power3.out'});

/* ---- entrée : le module se déploie (couches qui s'écartent), puis reflet ---- */
gsap.set([box,'.nav','.tagline','.lead','.vis .grid'],{opacity:0});gsap.set('.rv',{yPercent:110});gsap.set(items,{opacity:0});
function intro(){
  gsap.set(frames[0],{opacity:1});
  const tl=gsap.timeline({defaults:{ease:'power3.out'}});
  tl.fromTo('.nav',{opacity:0,y:-8},{opacity:1,y:0,duration:.8},0)
    .fromTo('.tagline',{opacity:0,x:-10},{opacity:1,x:0,duration:.7},.2)
    .to('.rv',{yPercent:0,duration:1.1,stagger:.12},.25)
    .fromTo('.lead',{opacity:0,y:14},{opacity:1,y:0,duration:.8},.55)
    .to('.vis .grid',{opacity:1,duration:1.2},.3)
    /* serré et à plat -> déployé */
    .fromTo(box,{opacity:0,scaleY:.3,scaleX:.94,y:40},{opacity:1,scaleY:1,scaleX:1,y:0,duration:2.1,ease:'power3.inOut'},.2)
    .add(doSweep,1.9)
    .fromTo(labels,{opacity:0,x:10},{opacity:1,x:0,duration:.6,stagger:.06},2.1)
    .fromTo(leads.flatMap(o=>[o.l,o.c]),{opacity:0},{opacity:1,duration:.6,stagger:.03},2.1)
    .fromTo(items,{opacity:0,y:12},{opacity:.32,y:0,duration:.6,stagger:.06,clearProps:'opacity,transform'},.8)
    .add(()=>{cycling=true;active=-1;select(0);
      addEventListener('mousemove',e=>{const nx=e.clientX/innerWidth-.5,ny=e.clientY/innerHeight-.5;qx(nx*-14);qy(ny*-10);});},2.7);
  /* respiration */
  gsap.to(box.querySelectorAll('.fr'),{y:-6,duration:5,ease:'sine.inOut',repeat:-1,yoyo:true,delay:3});
}
/* premier rendu d'abord (entrée dès qu'il est prêt), les autres ensuite */
let started=false;const go=()=>{if(!started){started=true;intro();}};
setTimeout(go,4000);
loadFrame(0).then(()=>{go();setTimeout(async()=>{for(let i=1;i<N;i++)await loadFrame(i);},2600);});
})();
</script>
</body>
</html>
