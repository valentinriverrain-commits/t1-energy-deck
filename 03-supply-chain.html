:root{--bg:#0F0E12;--fg:#fff;--mid:#BFB8B5;--low:#625B58}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:'Deck Sans',Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
.m{font-family:'Deck Mono','Courier New',monospace;font-weight:400;text-transform:uppercase}
.bg{position:absolute;inset:-2%;background-size:cover;background-position:center;will-change:transform,opacity}
.veil{position:absolute;inset:0;background:rgba(0,0,0,.2);pointer-events:none}
.logo{position:relative;display:block}
.logo img{display:block;width:100%;height:100%}
.logo .fb{display:none;font-family:'Deck Sans',sans-serif;font-weight:400;line-height:1;letter-spacing:-.04em}
.logo.nologo img{display:none}.logo.nologo .fb{display:block}
.bg .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

html,body{background:#ECEAE7}
#stage{background:#ECEAE7;color:#0F0E12}
.dark img{filter:brightness(0) saturate(100%) opacity(.94)}
.dark .fb{color:#0F0E12}
/* en-tête (au-dessus de la carte) */
.nav{position:absolute;left:576px;right:96px;top:24px;height:32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;z-index:5}
.nav .pg{position:absolute;left:384px;top:9px;font-size:14px;color:rgba(15,14,18,.5)}
.nav .lab{grid-column:3;justify-self:end;font-size:24px}
/* carte */
#map{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1}
#map .st{fill:#F8F7F5;stroke:#D6D2CD;stroke-width:.8;vector-effect:non-scaling-stroke}
#map .flow{fill:none;stroke:#0F0E12;stroke-width:1.4}
#map .pt{fill:#0F0E12}
#map .pin{fill:#fff;stroke:#0F0E12;stroke-width:1.5}
#map .scode{font-family:'Deck Mono',monospace;font-size:12px;letter-spacing:.06em;fill:#fff;text-anchor:middle}
#map .site rect{fill:#0F0E12;stroke:#fff;stroke-width:2}
#map .site text{font-family:'Deck Mono',monospace;font-size:13px;letter-spacing:.06em;fill:#0F0E12}
#map .site .bgt{fill:#fff;stroke:none}
.legend{position:absolute;right:96px;bottom:40px;display:flex;gap:28px;font-size:11px;letter-spacing:.06em;color:rgba(15,14,18,.6);z-index:5}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{display:block;width:10px;height:10px}
.legend .k1{background:#0F0E12}
.legend .k2{background:#fff;border:1.5px solid #0F0E12;width:8px;height:8px}
.legend .k3{width:22px;height:0;border-top:1.4px solid #0F0E12}
.nation{position:absolute;left:576px;bottom:40px;font-size:11px;letter-spacing:.06em;color:rgba(15,14,18,.6);z-index:5}

/* panneau gauche */
.panel{position:absolute;left:24px;top:24px;width:528px;bottom:24px;background:#fff;z-index:4;padding:24px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,14,18,.06)}
.ph{display:flex;justify-content:space-between;align-items:center;height:24px}
.ph .logo{width:64.8px;height:24px}
.ph .logo .fb{font-size:26px}
.ph .tg{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.06em;color:rgba(15,14,18,.6)}
.ph .tg i{display:block;width:7px;height:7px;background:#0F0E12}
.ttl{display:flex;align-items:center;gap:16px;margin-top:28px;height:64px;overflow:hidden}
.ttl h1{margin:0;font-family:'Deck Mono',monospace;font-weight:400;font-size:56px;line-height:1;text-transform:uppercase;white-space:nowrap}
.ttl h1 span{display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.tile{background:#F2F0ED;height:72px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between}
.tile .k{font-size:10px;letter-spacing:.08em;color:rgba(15,14,18,.55)}
.tile .v{font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk{position:relative;margin-top:10px;height:200px;background:#F2F0ED;overflow:hidden}
.blk.img .fr{position:absolute;inset:-8% 0;opacity:0}
.blk.img .fr img{position:absolute;left:50%;width:120%;transform:translateX(-50%);filter:url(#key)}
.blk.img .cap{position:absolute;left:14px;top:12px;font-size:10px;letter-spacing:.08em;color:rgba(15,14,18,.55)}
.blk.txt{padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between}
.blk.txt p{margin:0;font-weight:300;font-size:19px;line-height:1.35}
.blk.txt .sts{font-size:12px;letter-spacing:.08em;color:rgba(15,14,18,.7)}
.sel{margin-top:auto}
.sel .it{position:relative;display:flex;align-items:center;gap:12px;height:36px;cursor:pointer;opacity:.32;transition:opacity .4s}
.sel .it.on{opacity:1}
.sel .it .nm{font-size:15px;letter-spacing:.04em}
.sel .it .nb{margin-left:auto;font-size:12px;color:rgba(15,14,18,.55)}
.sel .bar{position:relative;height:1px;background:rgba(15,14,18,.12);margin-top:8px}
.sel .bar b{position:absolute;left:0;top:0;bottom:0;width:100%;background:#0F0E12;transform-origin:left center;transform:scaleX(0)}
/* icône modulaire 3x3 */
.ico{position:relative;flex:none}
.ico span{position:absolute;background:#0F0E12}
</style>

<script>/* utilitaires communs aux screens */
/* A() : chemin d'un fichier local ; la version téléphone (fichier unique) le remplace par une copie intégrée */
const A=p=>(window.__ASSET?window.__ASSET(p):p);
window.Deck={
  fit(stage){const f=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);gsap.set(stage,{xPercent:-50,yPercent:-50,scale:s});};addEventListener('resize',f);f();},
  /* photo : assets/photos/<nom>.jpg|.webp|.png, puis les noms suivants, sinon dégradé */
  bg(el,names,gradient){
    const list=[];names.forEach(n=>['jpg','webp','png','jpeg'].forEach(x=>list.push(A('assets/photos/'+n+'.'+x))));
    el.style.background=gradient;
    let i=0;const next=()=>{if(i>=list.length)return;const s=list[i++],im=new Image();
      im.onload=()=>{el.style.background='url("'+s+'") center/cover no-repeat';};im.onerror=next;im.src=s;};next();
  },
  /* vidéo par-dessus la photo : URL donnée, puis assets/videos/<nom>.mp4|.webm ; si rien ne charge, la photo reste */
  /* vidéos hébergées sur Cloudinary (compte de Valentin) : 1080p H.264 optimisé + première frame en image d'attente */
  CLD:'https://res.cloudinary.com/dvijxs9k0/video/upload/',
  cld(id){return {video:Deck.CLD+'c_fill,w_1920,h_1080,q_auto,vc_h264,ac_none/t1-deck/'+id+'.mp4',

  media(el,{video,cld,name,names,gradient,start}){

    if(poster){el.style.background=gradient;const im=new Image();im.onload=()=>{el.style.background='url("'+poster+'") center/cover no-repeat';};im.onerror=()=>Deck.bg(el,names,gradient);im.src=poster;}
    else Deck.bg(el,names,gradient);
    el._start=start||0;
    /* copie locale d'abord (plus fluide), puis l'URL en ligne */
    const srcs=[A('assets/videos/'+name+'.mp4'),A('assets/videos/'+name+'.webm')];if(video)srcs.push(video);
    let i=0;const next=()=>{if(i>=srcs.length){el._noVideo=true;if(el._ready){const f=el._ready;el._ready=null;f();}return;}
      const v=document.createElement('video');v.className='vid';v.muted=true;v.loop=true;v.playsInline=true;v.preload='metadata';
      v.setAttribute('muted','');v.setAttribute('playsinline','');

      if(el._start){v.loop=false;v.addEventListener('ended',()=>{v.currentTime=el._start;const p=v.play();if(p)p.catch(()=>{});});}
      v.addEventListener('loadedmetadata',()=>{if(el._start)v.currentTime=el._start;v.style.opacity=0;el.appendChild(v);el._video=v;if(el._play){const f=el._ready;el._ready=null;Deck.play(el,true,f);}},{once:true});
      v.addEventListener('error',next,{once:true});

  },
  /* lance / met en pause la vidéo d'un calque (fondu quand la première image est prête) */
  /* la photo reste visible tant que la vidéo n'est pas prête à être lue d'une traite ;

  play(el,on,onReady){el._play=on;
    const done=()=>{if(onReady){const f=onReady;onReady=null;f();}};
    const v=el._video;

    if(!v){if(el._noVideo)done();else el._ready=done;return;}
    v.preload='auto';if(el._start&&v.currentTime<el._start)v.currentTime=el._start;
    if(v._shown){const p=v.play();if(p)p.catch(()=>{});done();return;}

  },

    return function(i){const t=++tok;

      let done=false;const go=()=>{if(done||t!==tok)return;done=true;pend=-1;const old=vis;vis=i;

  /* image hébergée sur Cloudinary (photos T1) : copie locale assets/photos/<id>.jpg d'abord, puis le CDN, puis les photos de secours */
  CLDI:'https://res.cloudinary.com/dvijxs9k0/image/upload/',
  photo(el,{img,w,names,gradient}){el._noVideo=true;el.style.background=gradient||'#1b1a1f';
    const srcs=[A('assets/photos/'+img+'.jpg'),Deck.CLDI+'c_limit,w_'+(w||2400)+',q_auto:good,f_auto/t1-deck/'+img];let i=0;

      im.onload=()=>{el.style.background='url("'+s+'") center/cover no-repeat';};im.onerror=next;im.src=s;};next();},
  /* précharge la vidéo d'un calque (chapitre suivant) pour éviter les saccades au démarrage */
  warm(el){const v=el&&el._video;if(v&&v.preload!=='auto'){v.preload='auto';if(el._start&&v.currentTime<el._start)v.currentTime=el._start;}},
  logo(wrap){const img=wrap.querySelector('img');const no=()=>wrap.classList.add('nologo');
    if(img.complete&&!img.naturalWidth)no();img.addEventListener('error',no);}
};

      /* particules carrées qui circulent */
      for(let q=0;q<2;q++){const r=mk('rect',{width:5,height:5,class:'pt',opacity:0},$('gF'));pins.push(r);const o2={t:0};
        const tw=gsap.to(o2,{t:1,duration:2.4+len/600,ease:'none',repeat:-1,delay:1.2+q*1.2+j*.1,onUpdate:()=>{const pt=p.getPointAtLength(o2.t*L);r.setAttribute('x',pt.x-2.5);r.setAttribute('y',pt.y-2.5);r.setAttribute('opacity',o2.t<.06||o2.t>.94?0:1);}});
        pts.push({tw});}}
    const pin=mk('rect',{x:x-5,y:y-5,width:10,height:10,class:'pin'},$('gP'));
    const tc=mk('text',{x:x,y:y+22,class:'scode'},$('gP'));tc.textContent=k;
    gsap.fromTo([pin,tc],{opacity:0},{opacity:1,duration:.4,delay:.3+j*.08});pins.push(pin,tc);});
}

/* ---- sélection ---- */
function select(i){
  if(i===active||!ready)return;const prev=active;active=i;const m=MATS[i];
  items.forEach((it,j)=>it.classList.toggle('on',j===i));
  /* carte */
  const set=new Set(m.states),nation=!m.states.length;
  Object.keys(ST).forEach(k=>gsap.to(ST[k],{fill:set.has(k)?ON:(nation?TINT:FILL),stroke:set.has(k)?'#3a3940':'#D6D2CD',duration:.7,ease:'power2.inOut',overwrite:'auto'}));
  clearFlows();drawFlows(m);
  $('nation').textContent=nation?'■ '+m.src.toUpperCase()+' · NO SINGLE SOURCE STATE':'';
  /* panneau */
  if(prev>=0)gsap.to(frames[prev],{opacity:0,duration:.6,overwrite:'auto'});
  gsap.fromTo(frames[i],{opacity:0,y:10},{opacity:1,y:0,duration:.8,ease:'power2.out',overwrite:'auto'});
  setIcon(bigIco,m.ico,true);
  const out=['#t1','#t2','#ds','#sts','#cnt'];
  gsap.to('#ttl span',{yPercent:-110,duration:.35,ease:'power3.in',overwrite:true});
  gsap.to(out,{opacity:0,y:-6,duration:.25,overwrite:true,onComplete:()=>{
    $('ttl').innerHTML='<span>'+m.nm+'</span>';$('t1').textContent=m.rl;$('t2').textContent=m.src;$('ds').textContent=m.ds;
    $('sts').textContent=m.states.length?m.states.join('  ·  '):'NATIONWIDE';$('cnt').textContent='MATERIAL '+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
    gsap.fromTo('#ttl span',{yPercent:110},{yPercent:0,duration:.8,ease:'expo.out'});
    gsap.fromTo(out,{opacity:0,y:8},{opacity:1,y:0,duration:.55,stagger:.05,ease:'power3.out'});}});
  restart();
}
function restart(){if(timer)timer.kill();if(prog)prog.kill();gsap.set('#prog',{scaleX:0});
  if(hover||active<0)return;prog=gsap.to('#prog',{scaleX:1,duration:STEP,ease:'none'});timer=gsap.delayedCall(STEP,()=>select((active+1)%N));}

/* ---- entrée : un globe tourne de l'Europe vers les États-Unis en zoomant, puis se fond dans la carte à plat ---- */
const byX=Object.keys(ST).sort((a,b)=>MAP.centroid[a][0]-MAP.centroid[b][0]).map(k=>ST[k]);
gsap.set(byX,{opacity:0});gsap.set(Object.values(sites),{opacity:0});gsap.set('#panel',{opacity:0});gsap.set(items,{opacity:0});
const cv=document.getElementById('globe');let G=null,spin=true;
try{G=T1Globe.create(cv,{extent:[[640,150],[1840,990]],end:MAP.ortho});}catch(e){}
const sizeG=()=>{if(G)G.resize(Math.min(2,devicePixelRatio||1)*Math.max(stage.getBoundingClientRect().width/1920,.5));};
addEventListener('resize',sizeG);sizeG();
const drawG=()=>{if(G&&spin)G.draw();};gsap.ticker.add(drawG);
const E=G?G.END:null,T0=G?0:-3;
const tl=gsap.timeline({defaults:{ease:'power3.out'}});
tl.fromTo('.nav,.legend',{opacity:0},{opacity:1,duration:.8},0);
if(G){tl.fromTo(cv,{opacity:0},{opacity:1,duration:.7,ease:'power2.out'},0)
  .to(G.state,{lon:E.lon,lat:E.lat,duration:3,ease:'power2.inOut'},.1)
  .to(G.state,{k:E.k,tx:E.tx,ty:E.ty,duration:2,ease:'power3.inOut'},1.15)
  .to(G.state,{usa:1,duration:.7,ease:'power2.out'},1.9)
  .to(byX,{opacity:1,duration:.6,stagger:.006,ease:'power2.out'},3.0)
  .to(cv,{opacity:0,duration:.8,ease:'power2.inOut',onComplete:()=>{spin=false;gsap.ticker.remove(drawG);cv.remove();}},3.05);}
else tl.to(byX,{opacity:1,duration:.5,stagger:.018},.1);
tl.fromTo('#panel',{x:-40,opacity:0},{x:0,opacity:1,duration:1,ease:'power4.out'},T0+3.2)
  .fromTo(items,{opacity:0,x:-8},{opacity:.32,x:0,duration:.5,stagger:.05,clearProps:'opacity,transform'},T0+3.5)
  .to(Object.values(sites),{opacity:1,duration:.5,stagger:.12},T0+3.6)
  .add(()=>{ready=true;select(0);},T0+3.8);
})();
</script>
