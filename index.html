<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T1 Energy Deck</title>
<style>
/* Visionneuse plein écran : chaque écran du deck (1920x1080) dans un cadre ; en portrait, le cadre pivote pour lire en paysage */
:root{--ink:#0F0E12;--paper:#FFFFFF;--dim:rgba(255,255,255,.55);--rail:rgba(255,255,255,.18);--chip:rgba(15,14,18,.55);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;overscroll-behavior:none}
#view{position:fixed;left:0;top:0;transform-origin:0 0;background:var(--ink)}
#view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--ink);opacity:0;transition:opacity .5s ease}
#view iframe.on{opacity:1}
/* calque tactile : glisser ou toucher les bords pour changer d'écran (téléphone) */
#touch{position:absolute;inset:0;z-index:2;display:none;touch-action:none}
@media (pointer:coarse){#touch{display:block}}
.nav{position:absolute;top:50%;width:52px;height:52px;margin-top:-26px;border:1px solid var(--rail);border-radius:50%;background:var(--chip);color:var(--paper);
  display:grid;place-items:center;cursor:pointer;z-index:3;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:.9;transition:opacity .3s;touch-action:manipulation}
.nav:hover,.nav:focus-visible{opacity:1;outline:1px solid var(--paper);outline-offset:2px}
.nav svg{width:16px;height:16px}
#prev{left:max(10px,env(safe-area-inset-left,0px))}#next{right:max(10px,env(safe-area-inset-right,0px))}
.nav[disabled]{opacity:.2;cursor:default}
#bar{position:absolute;left:0;right:0;bottom:0;height:3px;display:flex;gap:2px;z-index:3;pointer-events:none}
#bar i{flex:1;background:var(--rail)}#bar i.on{background:var(--paper)}
#label{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--paper);background:var(--chip);padding:7px 10px;border-radius:2px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#label.show{opacity:1}
@media (prefers-reduced-motion:reduce){#view iframe{transition:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">

<div id="view">
  <div id="touch" aria-hidden="true"></div>
  <button class="nav" id="prev" aria-label="Écran précédent"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg></button>
  <button class="nav" id="next" aria-label="Écran suivant"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 3 5 5-5 5"/></svg></button>
  <div id="label"></div>
  <div id="bar"></div>
</div>

<script>
(function(){
const SCREENS=[
 ['intro','Cover'],['sommaire','Summary'],['01-mission','01 Mission'],['02-technology','02 Technology'],['03-supply-chain','03 Supply chain'],
 ['04-manufacturing','04 Manufacturing'],['05-traction','05 Traction'],['06-vision','06 Vision'],['07-fin','Closing']];
const view=document.getElementById('view'),bar=document.getElementById('bar'),label=document.getElementById('label');
const prev=document.getElementById('prev'),next=document.getElementById('next');
SCREENS.forEach(()=>bar.appendChild(document.createElement('i')));

/* en portrait, le cadre pivote de 90° : le deck se lit en paysage sans tourner le téléphone */
function layout(){const W=innerWidth,H=innerHeight,rot=H>W;
  if(rot){view.style.width=H+'px';view.style.height=W+'px';view.style.transform='translateX('+W+'px) rotate(90deg)';}
  else{view.style.width=W+'px';view.style.height=H+'px';view.style.transform='none';}}
addEventListener('resize',layout);layout();

let cur=-1,frame=null,hideT=null;
function idx(){const h=(location.hash||'').slice(1);const i=SCREENS.findIndex(s=>s[0]===h);return i<0?0:i;}
function mark(i){cur=i;[...bar.children].forEach((b,j)=>b.classList.toggle('on',j<=i));
  prev.disabled=i===0;next.disabled=i===SCREENS.length-1;
  label.textContent=String(i+1).padStart(2,'0')+' / '+String(SCREENS.length).padStart(2,'0')+' · '+SCREENS[i][1];
  label.classList.add('show');clearTimeout(hideT);hideT=setTimeout(()=>label.classList.remove('show'),1800);
}
function go(i){if(i<0||i>=SCREENS.length||i===cur)return;mark(i);
  const old=frame,f=document.createElement('iframe');f.title=SCREENS[i][1];f.setAttribute('allow','autoplay');
  f.src=SCREENS[i][0]+'.html';view.insertBefore(f,prev);frame=f;
  f.addEventListener('load',()=>{requestAnimationFrame(()=>f.classList.add('on'));
    if(old)setTimeout(()=>old.remove(),550);hook(f);},{once:true});}
/* dans l'écran : glisser pour changer d'écran ; un lien du sommaire ouvre le bon chapitre */
function hook(f){let w,d;try{w=f.contentWindow;d=f.contentDocument;}catch(e){return;}if(!d)return;
  d.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href$=".html"]');if(!a)return;
    const n=a.getAttribute('href').replace('.html','');const k=SCREENS.findIndex(s=>s[0]===n);if(k>=0){e.preventDefault();go(k);}},true);
  let x0=null,y0=null;
  d.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;},{passive:true});
  d.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)go(cur+(dx<0?1:-1));},{passive:true});
  d.addEventListener('keydown',key);}
function key(e){if(e.key==='ArrowRight'||e.key===' ')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);}
prev.addEventListener('click',()=>go(cur-1));next.addEventListener('click',()=>go(cur+1));
/* téléphone : glisser à gauche / à droite, ou toucher la moitié gauche / droite de l'écran */
const touch=document.getElementById('touch');let p0=null;
touch.addEventListener('pointerdown',e=>{p0={x:e.clientX,y:e.clientY,t:Date.now()};});
touch.addEventListener('pointerup',e=>{if(!p0)return;const r=view.getBoundingClientRect(),rot=view.style.transform!=='none';
  /* en portrait le cadre est pivoté : l'axe horizontal du deck suit l'axe vertical de l'écran */
  let dx=e.clientX-p0.x,dy=e.clientY-p0.y;if(rot){const t=dx;dx=dy;dy=-t;}
  const start=p0;p0=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){go(cur+(dx<0?1:-1));return;}
  if(Math.abs(dx)<12&&Math.abs(dy)<12){const along=rot?(start.y-r.top)/r.height:(start.x-r.left)/r.width;go(cur+(along<.5?-1:1));}});
touch.addEventListener('pointercancel',()=>{p0=null;});
addEventListener('keydown',key);
go(idx());
})();
</script>

</body></html>
